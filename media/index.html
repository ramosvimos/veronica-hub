            <p class="meta">Impact: Strengthens checkpoint rhythm and pressure progression.</p>
            <p class="meta">Note: High relevance for first-time visitors mapping core survival rhythm.</p>
            <a class="source-link" href="#reference-resident-evil-2">Open resource card</a>
          </article>

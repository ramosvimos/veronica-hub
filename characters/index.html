      color: var(--dim);
      font: 850 10px/1.35 var(--mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .badge {
      width: max-content;
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border: 1px solid currentColor;
      border-radius: 999px;
      font: 850 10px/1 var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .badge.confirmed { color: var(--green); }
    .badge.reported { color: var(--cyan); }
    .badge.rumor { color: var(--orange); }
    .badge.unknown { color: var(--dim); }
    .badge.site { color: #c084fc; }
    .badge.media { color: var(--cyan-2); }
    .badge.official { color: var(--green); }

    .badge.unknown {
      background: rgba(255,255,255,0.035);
      border-color: rgba(168,162,158,0.34);
    }

    .fact-card h3 {
      font: 850 15px/1.2 var(--sans);
      color: var(--muted);
    }

    .fact-card .value {
      margin-top: 8px;
      font: 900 24px/1.05 var(--sans);
      letter-spacing: 0;
    }

    .meta {
      color: var(--dim);
      font: 750 11px/1.5 var(--mono);
    }

    .source-link {
      color: var(--cyan-2);
      text-decoration: underline;
      text-decoration-color: rgba(103,232,249,0.28);
      text-underline-offset: 3px;
    }

    .media-reference-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .official-media-frame {
      position: relative;
      min-height: 270px;
      overflow: hidden;
      border: 1px solid rgba(103,232,249,0.24);
      border-radius: 12px;
      background:
        linear-gradient(135deg, rgba(56,189,248,0.07), rgba(95,17,24,0.14)),
        rgba(255,255,255,0.04);
      box-shadow: 0 24px 80px rgba(0,0,0,0.42);
    }

    .official-media-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(5,4,6,0.03), rgba(5,4,6,0.7)),
        repeating-linear-gradient(180deg, rgba(255,255,255,0.032) 0, rgba(255,255,255,0.032) 1px, transparent 1px, transparent 5px);
      z-index: 1;
    }

    .official-media-frame img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.72) contrast(1.08) saturate(0.9);
    }

    .official-media-frame.has-image:first-child img {
      object-position: 45% center;
    }

    .media-label,
    .media-copy {
      position: relative;
      z-index: 2;
    }

    .media-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px;
    }

    .media-label span {
      color: var(--cyan-2);
      font: 850 10px/1 var(--mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .media-placeholder {
      min-height: 126px;
      margin: 0 14px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      background:
        repeating-linear-gradient(180deg, rgba(255,255,255,0.03) 0, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 7px),
        rgba(0,0,0,0.22);
    }

    .media-placeholder span {
      color: rgba(231,229,228,0.36);
      font: 900 24px/1 var(--mono);
      letter-spacing: 0.08em;
    }

    .media-copy {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      display: grid;
      gap: 8px;
    }

    .media-copy h3 {
      font: 900 20px/1.08 var(--sans);
      letter-spacing: 0;
    }

    .timeline {
      display: grid;
      gap: 16px;
      position: relative;
      padding: 16px;
      border: 1px solid rgba(214,211,202,0.12);
      border-radius: 18px;
      background:
        linear-gradient(90deg, rgba(214,211,202,0.06) 0 1px, transparent 1px),
        rgba(45,36,31,0.12);
      background-size: 34px 34px;
    }

    .timeline::before {
      content: "";
      position: absolute;
      top: 10px;
      bottom: 10px;
      left: 114px;
      width: 1px;
      background: linear-gradient(180deg, var(--red), var(--cyan));
      opacity: .55;
    }

    .event {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 50px;
      align-items: start;
    }

    .event-date {
      color: var(--dim);
      font: 850 12px/1.2 var(--mono);
      padding-top: 18px;
    }

    .event-card {
      position: relative;
      padding: 18px;
      border-radius: 8px;
      background:
        linear-gradient(90deg, rgba(214,211,202,0.055), rgba(255,255,255,0.028)),
        rgba(0,0,0,0.14);
      transition: transform .2s ease, border-color .2s ease;
    }

    .event-card::before {
      content: "";
      position: absolute;
      left: -39px;
      top: 22px;
      width: 11px;
      height: 11px;
      border-radius: 999px;
      background: var(--cyan);
      box-shadow: 0 0 22px rgba(56,189,248,0.58);
    }

    .event-card.official::before { background: var(--green); box-shadow: 0 0 22px rgba(34,197,94,0.52); }
    .event-card.site::before { background: #a855f7; box-shadow: 0 0 22px rgba(168,85,247,0.5); }

    .event-card:hover {
      transform: translateY(-3px);
      border-color: rgba(103,232,249,0.32);
    }

    .event-card h3 {
      margin-top: 12px;
      font: 850 20px/1.15 var(--sans);
    }

    .event-card p {
      margin-top: 9px;
      color: var(--muted);
      line-height: 1.55;
    }

    .two-col {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 0.75fr);
      gap: 20px;
      align-items: stretch;
    }

    .editorial {
      padding: 26px;
      display: grid;
      gap: 18px;
      background:
        linear-gradient(90deg, rgba(214,211,202,0.075), transparent),
        var(--panel);
    }

    .editorial p {
      color: #d6d3d1;
      font-size: 18px;
      line-height: 1.72;
      text-wrap: pretty;
    }

    .briefing {
      padding: 22px;
      display: grid;
      gap: 16px;
    }

    .briefing h3 {
      font: 850 22px/1.1 var(--sans);
    }

    .briefing-list {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .briefing-list li {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.065);
      color: var(--muted);
    }

    .briefing-list strong { color: var(--text); }

    .release-card {
      padding: 24px;
      display: grid;
      gap: 18px;
      border-color: rgba(185,28,28,0.22);
      background:
        linear-gradient(135deg, rgba(95,17,24,0.24), rgba(56,189,248,0.05)),
        rgba(255,255,255,0.04);
    }

    .release-card .archive-meta {
      color: #fca5a5;
    }

    .source-proof-row {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      align-items: center;
      padding: 12px;
      border: 1px solid rgba(103,232,249,0.16);
      border-radius: 10px;
      background: rgba(0,0,0,0.14);
      color: var(--muted);
      font: 800 11px/1.4 var(--mono);
    }

    .source-proof-row a {
      color: var(--cyan-2);
      text-decoration: underline;
      text-decoration-color: rgba(103,232,249,0.28);
      text-underline-offset: 3px;
    }

    .track-next {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .track-next span {
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 0 10px;
      background: rgba(255,255,255,0.035);
      color: #d6d3d1;
      font: 800 11px/1 var(--mono);
    }

    .release-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .mini-stat {
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      background: rgba(0,0,0,0.18);
    }

    .mini-stat span {
      display: block;
      color: var(--dim);
      font: 800 11px/1 var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 9px;
    }

    .mini-stat strong {
      display: block;
      font: 900 24px/1 var(--sans);
    }

    .platform-grid,
    .character-grid,
    .source-grid,
    .faq-grid {
      display: grid;
      gap: 14px;
    }

    .platform-grid { grid-template-columns: repeat(5, 1fr); }
    .character-grid { grid-template-columns: repeat(6, 1fr); }
    .source-grid { grid-template-columns: repeat(4, 1fr); }
    .faq-grid { grid-template-columns: 1fr 1fr; }

    .platform-card,
    .character-card,
    .source-card {
      padding: 16px;
      min-height: 150px;
      display: grid;
      align-content: space-between;
      gap: 18px;
      border-radius: 8px;
    }

    .platform-card {
      border-color: rgba(103,232,249,0.14);
      background: linear-gradient(135deg, rgba(56,189,248,0.05), rgba(255,255,255,0.03));
    }

    .platform-note {
      margin: -12px 0 18px;
      color: var(--dim);
      font: 750 12px/1.5 var(--mono);
    }

    .store-file {
      margin-top: 14px;
      display: grid;
      gap: 10px;
      padding: 18px;
      border: 1px solid rgba(103,232,249,0.18);
      border-radius: 12px;
      background:
        linear-gradient(90deg, rgba(56,189,248,0.08), rgba(255,255,255,0.03)),
        rgba(0,0,0,0.14);
    }

    .store-file h3 {
      font: 900 22px/1.1 var(--sans);
    }

    .store-file p {
      color: #d6d3d1;
      line-height: 1.58;
    }

    .platform-icon {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(103,232,249,0.28);
      border-radius: 12px;
      display: grid;
      place-items: center;
      font: 900 13px/1 var(--mono);
      color: var(--cyan-2);
      background: rgba(56,189,248,0.06);
    }

    .platform-card h3,
    .source-card h3 {
      font: 850 18px/1.1 var(--sans);
    }

    .terminal {
      overflow: hidden;
      background: #030304;
      border-color: rgba(103,232,249,0.22);
    }

    .terminal-screen {
      aspect-ratio: 16 / 9;
      max-height: 620px;
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        repeating-linear-gradient(180deg, rgba(255,255,255,0.035) 0, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 7px),
        radial-gradient(circle at 18% 18%, rgba(255,255,255,0.045), transparent 7%),
        radial-gradient(circle at 50% 50%, rgba(56,189,248,0.12), transparent 33%),
        radial-gradient(circle at 78% 22%, rgba(185,28,28,0.16), transparent 24%),
        #050506;
    }

    .terminal-screen::before {
      content: "";
      position: absolute;
      inset: -30%;
      background: linear-gradient(100deg, transparent 35%, rgba(255,255,255,0.07), transparent 58%);
      animation: sweep 5.5s linear infinite;
    }

    .recording-dot {
      position: absolute;
      top: 18px;
      left: 18px;
      width: 11px;
      height: 11px;
      border-radius: 999px;
      background: var(--red);
      box-shadow: 0 0 20px rgba(185,28,28,0.85);
      animation: pulse 1.7s ease-in-out infinite;
    }

    .play-core {
      width: 82px;
      height: 82px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(103,232,249,0.38);
      border-radius: 50%;
      color: var(--cyan-2);
      background: rgba(255,255,255,0.035);
      box-shadow: 0 0 46px rgba(56,189,248,0.14);
      font: 900 30px/1 var(--sans);
      padding-left: 4px;
    }

    .terminal-message {
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
      gap: 14px;
      text-align: center;
      padding: 24px;
    }

    .terminal-message strong {
      color: #fff;
      font: 900 clamp(20px, 3vw, 34px)/1.05 var(--sans);
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .terminal-message p {
      max-width: 520px;
      color: var(--muted);
      font: 800 12px/1.55 var(--mono);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .timecode {
      position: absolute;
      top: 18px;
      right: 18px;
      color: rgba(231,229,228,0.72);
      font: 850 11px/1 var(--mono);
      letter-spacing: 0.06em;
    }

    .terminal-caption {
      position: absolute;
      bottom: 18px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      font: 800 11px/1.3 var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    @keyframes sweep { from { transform: translateX(-45%); } to { transform: translateX(45%); } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes pulseLine { 0%, 100% { opacity: .45; transform: scaleX(.96); } 50% { opacity: 1; transform: scaleX(1); } }

    .spoiler-card {
      padding: 22px;
      display: grid;
      gap: 14px;
      border-color: rgba(214,211,202,0.14);
      background:
        linear-gradient(90deg, rgba(214,211,202,0.08), rgba(255,255,255,0.03)),
        var(--panel);
    }

    .accordion {
      display: grid;
      gap: 10px;
    }

    .accordion-item {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,0.035);
      overflow: hidden;
    }

    .accordion-button {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 58px;
      padding: 0 16px;
      border: 0;
      color: var(--text);
      background: transparent;
      text-align: left;
      font: 850 15px/1.2 var(--sans);
    }

    .accordion-button:hover {
      background: rgba(103,232,249,0.045);
    }

    .accordion-body {
      padding: 0 16px 16px;
      color: var(--muted);
      line-height: 1.58;
    }

    .warning-copy {
      margin: 0 0 10px;
      padding: 10px 12px;
      border-left: 3px solid var(--orange);
      background: linear-gradient(90deg, rgba(249,115,22,0.14), rgba(255,255,255,0.03));
      color: #fed7aa;
      font: 850 11px/1.4 var(--mono);
      letter-spacing: 0.06em;
    }

    .character-card {
      min-height: 190px;
      position: relative;
      border-left: 3px solid rgba(185,28,28,0.72);
      background:
        radial-gradient(circle at 22% 26%, rgba(103,232,249,0.08), transparent 28%),
        linear-gradient(135deg, rgba(56,189,248,0.035), rgba(95,17,24,0.08)),
        rgba(255,255,255,0.035);
    }

    .character-card:nth-child(n+4) {
      border-color: rgba(124,58,237,0.7);
      background:
        radial-gradient(circle at 24% 22%, rgba(124,58,237,0.12), transparent 28%),
        linear-gradient(135deg, rgba(56,189,248,0.03), rgba(95,17,24,0.12)),
        rgba(255,255,255,0.035);
    }

    .monogram {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      border: 1px solid rgba(103,232,249,0.28);
      color: var(--text);
      background: linear-gradient(135deg, rgba(95,17,24,0.35), rgba(56,189,248,0.08));
      font: 900 17px/1 var(--mono);
    }

    .monogram::after {
      content: "";
      width: 26px;
      height: 15px;
      border: 1px solid rgba(255,255,255,0.18);
      border-top: 0;
      border-radius: 0 0 999px 999px;
      position: absolute;
      transform: translateY(21px);
      opacity: .45;
    }

    .character-card h3 {
      font: 850 17px/1.15 var(--sans);
    }

    .comparison-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(rgba(103,232,249,0.035) 1px, transparent 1px),
        rgba(255,255,255,0.035);
      background-size: 100% 44px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th, td {
      padding: 16px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      vertical-align: top;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: rgba(11,10,16,0.96);
      color: var(--muted);
      font: 850 11px/1 var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    td {
      color: #d6d3d1;
      line-height: 1.45;
    }

    tr:hover td { background: rgba(103,232,249,0.055); }

    .verification-policy {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
      padding: 16px;
      border: 1px solid rgba(249,115,22,0.24);
      border-radius: 10px;
      background: linear-gradient(90deg, rgba(249,115,22,0.12), rgba(255,255,255,0.03));
    }

    .verification-policy p {
      color: #d6d3d1;
      line-height: 1.55;
    }

    .redacted {
      display: inline-block;
      height: 10px;
      width: min(240px, 58vw);
      border-radius: 2px;
      background: rgba(0,0,0,0.86);
      box-shadow: 70px 0 0 rgba(0,0,0,0.72);
    }

    .source-card {
      background:
        linear-gradient(135deg, rgba(103,232,249,0.05), rgba(255,255,255,0.025)),
        rgba(0,0,0,0.13);
    }

    .newsletter {
      position: relative;
      overflow: hidden;
      padding: 28px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: center;
      background:
        linear-gradient(135deg, rgba(95,17,24,0.5), rgba(36,16,47,0.58)),
        rgba(255,255,255,0.045);
    }

    .newsletter h2 {
      font: 900 34px/1.05 var(--sans);
      letter-spacing: 0;
    }

    .newsletter p {
      margin-top: 10px;
      color: #d6d3d1;
      line-height: 1.55;
    }

    .disabled-input {
      min-height: 48px;
      width: min(360px, 100%);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      background: rgba(0,0,0,0.2);
      color: var(--dim);
      padding: 0 14px;
    }

    .footer {
      padding: 38px 0;
      border-top: 1px solid rgba(255,255,255,0.08);
      background: #030304;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 26px;
      align-items: start;
    }

    .footer p,
    .footer a {
      color: var(--muted);
      line-height: 1.6;
    }

    .footer-links {
      display: grid;
      gap: 8px;
    }

    .search-overlay,
    .mobile-drawer {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      background: rgba(5,4,6,0.76);
      backdrop-filter: blur(18px);
      padding: 22px;
    }

    .search-modal {
      width: min(680px, 100%);
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(11,10,16,0.96);
      box-shadow: 0 34px 110px rgba(0,0,0,0.62);
      padding: 18px;
    }

    .search-input {
      width: 100%;
      min-height: 54px;
      border: 1px solid rgba(103,232,249,0.28);
      border-radius: 14px;
      background: rgba(255,255,255,0.045);
      color: var(--text);
      padding: 0 16px;
      outline: none;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      margin-bottom: 14px;
    }

    .close-button {
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font: 900 18px/1 var(--sans);
    }

    .mobile-drawer {
      place-items: stretch;
      padding: 0;
    }

    .drawer-panel {
      width: min(460px, 100%);
      margin-left: auto;
      padding: 20px;
      background: rgba(11,10,16,0.97);
      border-left: 1px solid var(--line);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 22px;
    }

    .drawer-links {
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .drawer-links a {
      min-height: 50px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 14px;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      color: var(--text);
      background: rgba(255,255,255,0.035);
      font: 850 17px/1 var(--sans);
    }

    .drawer-links span {
      color: var(--cyan-2);
      font: 850 12px/1 var(--mono);

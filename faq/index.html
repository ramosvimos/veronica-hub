      <section class="static-section">
        <h2>Frequently Asked Questions</h2>
        <div class="static-faq-list">
          <article class="static-card"><h3>Is Resident Evil Code Veronica Remake official?</h3><p>Yes. Capcom announced Resident Evil Veronica for 2027. Official sources describe it as a remake of 2000's Resident Evil Code: Veronica, so the project itself, remake positioning and release window are confirmed rather than rumor.</p></article><article class="static-card"><h3>What has Capcom confirmed about the remake itself?</h3><p>Capcom and Steam describe it as a remake that preserves the essence of the original while adding modernized gameplay, a reimagined storyline and detailed graphics. That confirms direction, but it does not reveal final puzzle design, chapter structure, enemy list or every returning scene.</p></article><article class="static-card"><h3>Is Resident Evil Veronica first-person or third-person?</h3><p>The official trailer includes first-person-looking footage, but producer interview and media Q&amp;A coverage describe the remake as a third-person game. Treat this as reported producer context until Capcom publishes a full gameplay breakdown.</p></article><article class="static-card"><h3>Why is it called Resident Evil Veronica instead of Code Veronica?</h3><p>A producer interview says the team still respects the Code Veronica name, but shortened the remake title to communicate that this story is important like a numbered Resident Evil entry and to align with recent one-word subtitle conventions.</p></article><article class="static-card"><h3>Where does the story begin?</h3><p>Steam places the premise three months after the Raccoon City disaster, with Claire searching for Chris before being captured by Umbrella forces and taken to Rockfort Island. This is the safest spoiler-light setup to repeat because it comes from the current store synopsis.</p></article><article class="static-card"><h3>What is the exact release date?</h3><p>A 2027 release window is confirmed. An exact release date has not been officially confirmed, so day-and-month claims from placeholders, reposts or countdown pages should be treated as unconfirmed unless Capcom or an official platform store publishes them.</p></article><article class="static-card"><h3>What platforms are confirmed?</h3><p>Official sources list PlayStation 5, Xbox Series X|S, Nintendo Switch 2 and PC. Steam also has a live store page, which confirms PC store presence and wishlist access but not final PC requirements or price.</p></article><article class="static-card"><h3>Are PC system requirements confirmed?</h3><p>No. Steam lists minimum and recommended system requirements as TBD. PC is confirmed, but exact specs are not official yet, so hardware estimates should be treated as preparation guidance rather than purchase guarantees.</p></article><article class="static-card"><h3>Can I use the estimated PC requirements to buy hardware?</h3><p>Treat the estimate as preparation guidance, not an official purchase guarantee. Wait for Capcom or Steam to publish Resident Evil Veronica requirements before making a final upgrade decision.</p></article><article class="static-card"><h3>Is there a demo?</h3><p>No official demo has been confirmed at the current verification time. A demo would need a Capcom announcement or a live official platform listing before this site treats it as real.</p></article><article class="static-card"><h3>Are preorders or editions available?</h3><p>Wishlist access exists on Steam, but preorder timing, price and editions are not officially confirmed yet. Wishlist buttons should not be confused with preorder checkout, collector editions, deluxe content or physical release plans.</p></article><article class="static-card"><h3>Is Veronica Hub an official Capcom site?</h3><p>No. Veronica Hub is an independent fan-made information site and is not affiliated with or endorsed by Capcom.</p></article>
        </div>

    /* 2026-06-10 visual pass: calmer premium dossier, richer official media. */
    :root {
      --bg: #040303;
      --bg2: #0b0809;
      --panel: rgba(255, 255, 255, .046);
      --line: rgba(255, 255, 255, .105);
      --text: #f3f0ec;
      --muted: #c5bdb7;
      --dim: #847a72;
      --red: #c41b22;
      --cyan: #8be9f5;
      --sans: "Avenir Next", "Space Grotesk", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --body: "Avenir Next", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background:
        radial-gradient(ellipse at 72% 8%, rgba(195, 27, 34, .22), transparent 34rem),
        radial-gradient(ellipse at 8% 10%, rgba(139, 233, 245, .08), transparent 28rem),
        linear-gradient(180deg, #040303 0%, #0b0809 54%, #040303 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      opacity: .16;
      background:
        repeating-linear-gradient(180deg, rgba(255,255,255,.032) 0 1px, transparent 1px 6px),
        radial-gradient(ellipse at 50% 36%, transparent 0 44%, rgba(0,0,0,.34) 78%);
      mix-blend-mode: screen;
    }

    .topbar {
      height: 68px;
      background: rgba(5, 3, 4, .74);
      border-bottom-color: rgba(255,255,255,.08);
    }

    .topbar-inner {
      width: min(1240px, calc(100vw - 40px));
    }

    .nav a {
      padding: 8px 11px;
    }

    .utility-button,
    .latest-pill {
      min-height: 36px;
      border-radius: 10px;
      letter-spacing: .02em;
    }

    .hero {
      min-height: clamp(690px, 86vh, 940px);
      padding: clamp(72px, 8vw, 110px) 0 clamp(64px, 7vw, 92px);
    }

    .hero::before {
      background:
        linear-gradient(90deg, rgba(4,3,3,.98) 0%, rgba(4,3,3,.9) 32%, rgba(4,3,3,.38) 63%, rgba(4,3,3,.78) 100%),
        linear-gradient(180deg, rgba(4,3,3,.08), rgba(4,3,3,.97)),
        radial-gradient(ellipse at 74% 46%, rgba(196,27,34,.12) 0 28%, transparent 58%),
        url("/assets/official/capcom-veronica-press-a.png") 73% center / auto 104% no-repeat,
        url("/assets/official/steam/steam-page-bg.jpg") center / cover no-repeat;
      filter: saturate(1.04) contrast(1.02);
    }

    .hero-grid {
      grid-template-columns: minmax(0, 760px) minmax(300px, 390px);
      gap: clamp(36px, 7vw, 86px);
      align-items: center;
    }

    .hero-copy {
      max-width: 760px;
    }

    .hero-kicker {
      display: inline-flex;
      margin-bottom: 16px;
      color: var(--cyan);
      font: 850 12px/1 var(--mono);
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .hero-title-treatment {
      display: none;
    }

    .eyebrow-row {
      margin-bottom: 18px;
    }

    .chip {
      min-height: 28px;
      padding: 0 9px;
      border-radius: 8px;
      background: rgba(255,255,255,.04);
      letter-spacing: .025em;
    }

    .hero h1 {
      max-width: 740px;
      font-size: clamp(52px, 6vw, 88px);
      line-height: .94;
      letter-spacing: -.015em;
    }

    .hero-subtitle {
      max-width: 610px;
      color: rgba(243,240,236,.82);
      font-size: clamp(18px, 1.5vw, 21px);
      line-height: 1.58;
    }

    .btn {
      min-height: 48px;
      border-radius: 10px;
      padding: 0 19px;
    }

    .btn.primary {
      background: linear-gradient(135deg, #d21f26, #731018 58%, #211018);
      box-shadow: 0 18px 46px rgba(196,27,34,.26);
    }

    .btn.secondary {
      border-color: rgba(139,233,245,.26);
      background: rgba(8, 8, 10, .56);
      backdrop-filter: blur(12px);
    }

    .hero-dossier {
      align-self: center;
      gap: 0;
    }

    .hero-dossier .dossier-panel {
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(13,14,18,.72), rgba(7,7,9,.58));
      box-shadow: 0 28px 90px rgba(0,0,0,.34);
    }

    .panel-header {
      padding: 16px 16px 14px;
    }

    .tracking-pulse {
      height: 22px;
    }

    .status-list {
      gap: 0;
      padding: 16px;
    }

    .status-row {
      grid-template-columns: 112px 1fr;
      gap: 14px;
      padding: 12px 0;
    }

    .status-row:first-child {
      padding-top: 0;
    }

    .status-row dt {
      color: rgba(197,189,183,.55);
      letter-spacing: .035em;
    }

    .section {
      padding: clamp(60px, 7vw, 92px) 0;
      scroll-margin-top: 86px;
    }

    .section.tight {
      padding-top: clamp(40px, 5vw, 64px);
    }

    .section-heading {
      max-width: 860px;
      margin-bottom: 28px;
    }

    .section-heading h2 {
      font-size: clamp(34px, 4.2vw, 58px);
      letter-spacing: -.015em;
    }

    .media-reference-grid {
      grid-template-columns: minmax(0, 1.2fr) minmax(280px, .8fr);
      grid-auto-flow: row;
      gap: 16px;
    }

    .media-reference-grid .official-media-frame:first-child {
      grid-row: span 2;
      min-height: 560px;
    }

    .media-reference-grid .official-media-frame:not(:first-child) {
      min-height: 272px;
    }

    .official-media-frame {
      border-radius: 12px;
      border-color: rgba(255,255,255,.12);
      background: rgba(255,255,255,.035);
    }

    .official-media-frame.fit-contain img {
      padding: 18px;
      background: rgba(0,0,0,.18);
    }

    .screenshot-wall {
      padding-top: 10px;
    }

    .screenshot-grid {
      display: grid;
      grid-template-columns: 1.2fr .8fr .8fr;
      grid-auto-rows: 210px;
      gap: 14px;
    }

    .screenshot-card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      background: rgba(255,255,255,.035);
      box-shadow: 0 24px 80px rgba(0,0,0,.28);
    }

    .screenshot-card:first-child {
      grid-row: span 2;
    }

    .screenshot-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: brightness(.84) contrast(1.06) saturate(.94);
      transition: transform .45s ease, filter .45s ease;
    }

    .screenshot-card:hover img {
      transform: scale(1.035);
      filter: brightness(.95) contrast(1.08) saturate(1);
    }

    .screenshot-card span {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 2;
      padding: 7px 9px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 8px;
      background: rgba(0,0,0,.58);
      color: rgba(243,240,236,.86);
      font: 850 10px/1 var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .facts-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .fact-card {
      min-height: 168px;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255,255,255,.052), rgba(255,255,255,.032));
      box-shadow: none;
    }

    .fact-card .value,
    .value {
      font-size: clamp(22px, 2.2vw, 30px);
      line-height: 1.05;
    }

    .platform-grid {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .platform-card {
      min-height: 178px;
      border-radius: 12px;
      box-shadow: none;
    }

    .terminal,
    .card,
    .store-file,
    .verification-policy {
      border-radius: 12px;
    }

    .trailer-poster-button img {
      filter: brightness(.78) contrast(1.06) saturate(.95);
    }

    @media (max-width: 1120px) {
      .utility-button:not(.small),
      .latest-pill {
        display: none;
      }

      .utility-button.small {
        display: inline-flex;
      }

      .hero-grid {
        grid-template-columns: 1fr;
      }

      .hero::before {
        background:
          linear-gradient(180deg, rgba(4,3,3,.72), rgba(4,3,3,.98)),
          radial-gradient(ellipse at 82% 22%, rgba(196,27,34,.16), transparent 50%),
          url("/assets/official/capcom-veronica-press-a.png") 86% 0 / auto 76% no-repeat,
          url("/assets/official/steam/steam-page-bg.jpg") center / cover no-repeat;
      }

      .hero-dossier {
        max-width: 680px;
      }

      .platform-grid,
      .facts-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .screenshot-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 720px) {
      .topbar {
        height: 64px;
      }

      .topbar-inner {
        width: calc(100vw - 24px);
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
      }

      .brand {
        min-width: 0;
        gap: 9px;
      }

      .brand-title {
        min-width: 0;
      }

      .brand-title strong {
        max-width: 128px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 14px;
      }

      .brand-title span {
        display: none;
      }

      .top-actions {
        gap: 7px;
      }

      .utility-button.small {
        min-width: 52px;
        min-height: 36px;
        padding: 0 9px;
        font-size: 10px;
      }

      .hero {
        padding: 48px 0 42px;
      }

      .hero::before {
        background:
          linear-gradient(180deg, rgba(4,3,3,.82), rgba(4,3,3,.98) 70%),
          radial-gradient(ellipse at 88% 10%, rgba(196,27,34,.22), transparent 45%),
          url("/assets/official/capcom-veronica-press-a.png") 86% top / auto 52% no-repeat,
          url("/assets/official/steam/steam-page-bg.jpg") center / cover no-repeat;
      }

      .hero-kicker {
        margin-top: 120px;
        font-size: 10px;
      }

      .eyebrow-row {
        gap: 8px;
      }

      .chip {
        max-width: 100%;
        white-space: normal;
        line-height: 1.15;
        padding: 7px 9px;
      }

      .hero h1 {
        font-size: clamp(42px, 13vw, 58px);
        line-height: .94;
      }

      .hero-subtitle {
        font-size: 17px;
      }

      .hero-dossier {
        display: none;
      }

      .trust-note {
        font-size: 10px;
      }

      .media-reference-grid,
      .facts-grid,
      .platform-grid,
      .release-grid,
      .source-grid,
      .screenshot-grid {
        display: grid;
        grid-template-columns: 1fr;
      }

      .media-reference-grid .official-media-frame:first-child,
      .media-reference-grid .official-media-frame:not(:first-child) {
        grid-row: auto;
        min-height: 320px;
      }

      .screenshot-grid {
        grid-auto-rows: 210px;
      }

      .screenshot-card:first-child {
        grid-row: span 1;
      }

      .facts-grid {
        overflow: visible;
      }

      .fact-card {
        min-width: 0;
        min-height: 150px;
      }

      .section-heading p {
        font-size: 16px;
      }
    }
  </style>
</head>
